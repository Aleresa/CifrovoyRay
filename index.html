<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Цифровой Рай</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --surface: #f5f6f8;
      --text: #17182b;
      --muted: #737782;
      --border: #e8e9ee;
      --active: #191a2f;
      --active-text: #ffffff;
      --shadow: 0 12px 36px rgba(20, 24, 43, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .header {
      position: sticky;
      z-index: 10;
      top: 0;
      padding-top: env(safe-area-inset-top);
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header__inner {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 14px 18px;
    }

    .logo {
      display: block;
      width: min(100%, 245px);
      height: auto;
      margin: 0 0 14px;
    }

    .menu {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 0 5px;
      scrollbar-width: none;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu__button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .menu__button:hover {
      border-color: #cfd2da;
    }

    .menu__button:active {
      transform: scale(0.97);
    }

    .menu__button[aria-selected="true"] {
      border-color: var(--active);
      background: var(--active);
      color: var(--active-text);
    }

    .menu__button:focus-visible,
    .product-card:focus-visible,
    .modal__arrow:focus-visible,
    .modal__close:focus-visible {
      outline: 3px solid rgba(25, 26, 47, 0.2);
      outline-offset: 3px;
    }

    .content {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 30px 18px calc(40px + env(safe-area-inset-bottom));
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 14px;
    }

    .product-card {
      display: block;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .product-card__image-wrap {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 1px 0 var(--border);
    }

    .product-card__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 260ms ease;
    }

    .product-card:hover .product-card__image {
      transform: scale(1.025);
    }

    .product-card__title {
      display: block;
      margin-top: 11px;
      padding-inline: 2px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
      background: rgba(15, 16, 25, 0.72);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .modal__dialog {
      position: relative;
      overflow: hidden;
      width: min(100%, 520px);
      max-height: calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border-radius: 26px;
      background: var(--background);
      box-shadow: var(--shadow);
    }

    .modal__media {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      touch-action: pan-y;
    }

    .modal__image {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: calc(100dvh - 122px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      background: var(--surface);
      background-repeat: no-repeat;
    }

    .modal__arrow {
      position: absolute;
      top: 50%;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0 0 3px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      box-shadow: 0 6px 20px rgba(20, 24, 43, 0.16);
      cursor: pointer;
      font-size: 31px;
      line-height: 1;
      transform: translateY(-50%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal__arrow--previous {
      left: 12px;
    }

    .modal__arrow--next {
      right: 12px;
    }

    .modal__counter {
      position: absolute;
      right: 14px;
      bottom: 14px;
      min-width: 54px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(20, 21, 35, 0.76);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal__title {
      margin: 0;
      padding: 18px 64px 20px;
      font-size: 19px;
      line-height: 1.3;
      text-align: center;
    }

    .modal__close {
      position: absolute;
      right: 14px;
      bottom: 13px;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
    }

    body.modal-open {
      overflow: hidden;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 720px) {
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 34px;
        padding-block: 16px;
      }

      .logo {
        width: 270px;
        margin: 0;
      }

      .menu {
        justify-content: flex-end;
        padding-bottom: 2px;
      }

      .content {
        padding-top: 42px;
      }

      .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 30px 24px;
      }

      .product-card__image-wrap {
        border-radius: 24px;
      }

      .product-card__title {
        margin-top: 14px;
        font-size: 17px;
      }
    }

    @media (min-width: 1020px) {
      .products {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu__button,
      .product-card__image,
      .modal {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <img class="logo" src="assets/logo.png" alt="Цифровой Рай">

      <nav class="menu" aria-label="Категории" role="tablist">
        <button class="menu__button" type="button" role="tab" aria-selected="true" data-category="iphone">iPhone</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="ipad">iPad</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="macbook">MacBook</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="airpods">AirPods</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="powerbanks">Аккумуляторы</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="cables">Кабели и Зарядки</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="applewatch">Apple Watch</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-category="glass">Стекла</button>
      </nav>
    </div>
  </header>

  <main class="content">
    <section aria-label="Каталог товаров">
      <div class="products" id="products"></div>
    </section>
  </main>

  <div class="modal" id="product-modal" aria-hidden="true">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__media" id="modal-media">
        <div class="modal__image" id="modal-image" role="img"></div>
        <button class="modal__arrow modal__arrow--previous" id="modal-previous" type="button" aria-label="Предыдущее фото">&#8249;</button>
        <button class="modal__arrow modal__arrow--next" id="modal-next" type="button" aria-label="Следующее фото">&#8250;</button>
        <span class="modal__counter" id="modal-counter" aria-live="polite"></span>
      </div>
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="modal__close" id="modal-close" type="button" aria-label="Закрыть">&times;</button>
    </div>
  </div>

  <script>
    const makeProduct = (id, title, photoCount) => {
      return {
        title,
        image: `assets/products/${id}.webp`,
        sprite: `assets/sprites/${id}.webp`,
        photoCount,
        columns: 4,
        rows: Math.ceil(photoCount / 4)
      };
    };

    const productCatalog = {
      iphone: [
        makeProduct(1, "Alba Series", 12),
        makeProduct(2, "Ocean Series", 14),
        makeProduct(3, "Slim Series", 12),
        makeProduct(4, "Clarity Series", 20),
        makeProduct(5, "Modern Series", 18),
        makeProduct(6, "Kevlar Series", 16),
        makeProduct(7, "Aurora Series", 15),
        makeProduct(8, "Shockproof", 13),
        makeProduct(9, "Sunrise Series", 21),
        makeProduct(10, "Super Slim Series", 13)
      ],
      ipad: [
        makeProduct(11, "Origami Series", 17),
        makeProduct(12, "Milano Series", 19),
        makeProduct(13, "Magnet Series", 16)
      ],
      macbook: [
        makeProduct(14, "Slim Series", 12),
        makeProduct(15, "Matte Series", 12)
      ],
      airpods: [
        makeProduct(16, "Color Series", 15)
      ],
      powerbanks: [
        makeProduct(17, "Speed Series", 15),
        makeProduct(18, "Cube Series", 19),
        makeProduct(19, "Wave Series", 15),
        makeProduct(20, "Kevlar Series", 20),
        makeProduct(21, "Flow Series", 18)
      ],
      cables: [
        makeProduct(22, "Braided Series", 12),
        makeProduct(23, "Silicone Series", 12),
        makeProduct(24, "Wave Series", 16)
      ],
      applewatch: [
        makeProduct(25, "Alpine Loop", 9),
        makeProduct(26, "Metal Classic", 11),
        makeProduct(27, "Milanese Loop", 9),
        makeProduct(28, "Ocean Band", 8),
        makeProduct(29, "Sport Band", 10),
        makeProduct(30, "Titanium Loop", 10)
      ],
      glass: [
        makeProduct(31, "Basic iPhone", 12),
        makeProduct(32, "Premium iPhone", 14),
        makeProduct(33, "Basic iPad", 12)
      ]
    };

    const menuButtons = document.querySelectorAll(".menu__button");
    const products = document.querySelector("#products");
    const modal = document.querySelector("#product-modal");
    const modalMedia = document.querySelector("#modal-media");
    const modalImage = document.querySelector("#modal-image");
    const modalTitle = document.querySelector("#modal-title");
    const modalPrevious = document.querySelector("#modal-previous");
    const modalNext = document.querySelector("#modal-next");
    const modalCounter = document.querySelector("#modal-counter");
    const modalClose = document.querySelector("#modal-close");

    let lastFocusedCard = null;
    let activeProduct = null;
    let galleryIndex = 0;
    let touchStartX = 0;

    const showGalleryImage = (index) => {
      galleryIndex = (index + activeProduct.photoCount) % activeProduct.photoCount;
      const column = galleryIndex % activeProduct.columns;
      const row = Math.floor(galleryIndex / activeProduct.columns);
      const positionX = activeProduct.columns === 1 ? 0 : (column / (activeProduct.columns - 1)) * 100;
      const positionY = activeProduct.rows === 1 ? 0 : (row / (activeProduct.rows - 1)) * 100;

      modalImage.style.backgroundImage = `url("${activeProduct.sprite}")`;
      modalImage.style.backgroundSize = `${activeProduct.columns * 100}% ${activeProduct.rows * 100}%`;
      modalImage.style.backgroundPosition = `${positionX}% ${positionY}%`;
      modalImage.setAttribute("aria-label", `${modalTitle.textContent}, фото ${galleryIndex + 1}`);

      const hasMultipleImages = activeProduct.photoCount > 1;
      modalPrevious.hidden = !hasMultipleImages;
      modalNext.hidden = !hasMultipleImages;
      modalCounter.hidden = !hasMultipleImages;
      modalCounter.textContent = `${galleryIndex + 1} / ${activeProduct.photoCount}`;
    };

    const showPreviousImage = () => showGalleryImage(galleryIndex - 1);
    const showNextImage = () => showGalleryImage(galleryIndex + 1);

    const openProduct = (product, card) => {
      lastFocusedCard = card;
      modalTitle.textContent = product.title;
      activeProduct = product;
      showGalleryImage(0);
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      modalClose.focus();
    };

    const renderCategory = (category) => {
      products.replaceChildren();

      productCatalog[category].forEach((product, index) => {
        const card = document.createElement("button");
        card.className = "product-card";
        card.type = "button";
        card.setAttribute("aria-label", `Открыть ${product.title}`);

        const imageWrap = document.createElement("span");
        imageWrap.className = "product-card__image-wrap";

        const image = document.createElement("img");
        image.className = "product-card__image";
        image.src = product.image;
        image.alt = product.title;
        image.loading = index < 4 ? "eager" : "lazy";
        image.decoding = "async";

        const title = document.createElement("span");
        title.className = "product-card__title";
        title.textContent = product.title;

        imageWrap.append(image);
        card.append(imageWrap, title);
        card.addEventListener("click", () => openProduct(product, card));
        products.append(card);
      });
    };

    const closeModal = () => {
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      if (lastFocusedCard) lastFocusedCard.focus();
    };

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        menuButtons.forEach((item) => item.setAttribute("aria-selected", "false"));
        button.setAttribute("aria-selected", "true");
        renderCategory(button.dataset.category);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    modalPrevious.addEventListener("click", showPreviousImage);
    modalNext.addEventListener("click", showNextImage);
    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    modalMedia.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    modalMedia.addEventListener("touchend", (event) => {
      const distance = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(distance) < 45 || activeProduct.photoCount < 2) return;
      distance > 0 ? showPreviousImage() : showNextImage();
    }, { passive: true });

    document.addEventListener("keydown", (event) => {
      if (modal.getAttribute("aria-hidden") !== "false") return;
      if (event.key === "Escape") closeModal();
      if (event.key === "ArrowLeft" && activeProduct.photoCount > 1) showPreviousImage();
      if (event.key === "ArrowRight" && activeProduct.photoCount > 1) showNextImage();
    });

    renderCategory("iphone");

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor("#ffffff");
      window.Telegram.WebApp.setBackgroundColor("#ffffff");
    }
  </script>
</body>
</html>
