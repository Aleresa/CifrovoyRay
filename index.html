<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Цифровой Рай</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --surface: #f6f7f9;
      --text: #15171a;
      --muted: #777d86;
      --border: #e8e9ec;
      --active: #15171a;
      --active-text: #ffffff;
      --radius: 999px;
      --shadow: 0 8px 28px rgba(20, 24, 31, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .header {
      position: sticky;
      z-index: 10;
      top: 0;
      padding-top: env(safe-area-inset-top);
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header__inner {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 18px 20px;
    }

    .brand {
      display: block;
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .menu {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 0 5px;
      scrollbar-width: none;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu__button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
      transition:
        color 160ms ease,
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .menu__button:hover {
      border-color: #cfd2d7;
    }

    .menu__button:active {
      transform: scale(0.97);
    }

    .menu__button[aria-selected="true"] {
      border-color: var(--active);
      background: var(--active);
      color: var(--active-text);
    }

    .menu__button:focus-visible {
      outline: 3px solid rgba(21, 23, 26, 0.2);
      outline-offset: 2px;
    }

    .content {
      display: grid;
      min-height: calc(100dvh - 140px);
      place-items: center;
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
    }

    .card {
      width: min(100%, 640px);
      padding: 48px 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--background);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .card__label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card__title {
      margin: 0;
      font-size: clamp(34px, 8vw, 64px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .card__text {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    @media (min-width: 720px) {
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding-block: 22px;
      }

      .brand {
        margin: 0;
        white-space: nowrap;
      }

      .menu {
        justify-content: flex-end;
        padding-bottom: 2px;
      }

      .content {
        min-height: calc(100dvh - 88px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu__button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <span class="brand">Цифровой Рай</span>

      <nav class="menu" aria-label="Бренды" role="tablist">
        <button class="menu__button" type="button" role="tab" aria-selected="true" data-brand="Gurdini">Gurdini</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="iNeez">iNeez</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="McDodo">McDodo</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="WiWU">WiWU</button>
      </nav>
    </div>
  </header>

  <main class="content">
    <section class="card" aria-live="polite">
      <p class="card__label">Выбранный бренд</p>
      <h1 class="card__title" id="brand-title">Gurdini</h1>
      <p class="card__text">Здесь появится содержимое раздела.</p>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll(".menu__button");
    const title = document.querySelector("#brand-title");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((item) => item.setAttribute("aria-selected", "false"));
        button.setAttribute("aria-selected", "true");
        title.textContent = button.dataset.brand;
      });
    });

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor("#ffffff");
      window.Telegram.WebApp.setBackgroundColor("#ffffff");
    }
  </script>
</body>
</html>
