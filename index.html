<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Цифровой Рай</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --surface: #f5f6f8;
      --text: #17182b;
      --muted: #737782;
      --border: #e8e9ee;
      --active: #191a2f;
      --active-text: #ffffff;
      --shadow: 0 12px 36px rgba(20, 24, 43, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .header {
      position: sticky;
      z-index: 10;
      top: 0;
      padding-top: env(safe-area-inset-top);
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header__inner {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 14px 18px;
    }

    .logo {
      display: block;
      width: min(100%, 245px);
      height: auto;
      margin: 0 0 14px;
    }

    .menu {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 0 5px;
      scrollbar-width: none;
    }

    .menu::-webkit-scrollbar {
      display: none;
    }

    .menu__button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .menu__button:hover {
      border-color: #cfd2da;
    }

    .menu__button:active {
      transform: scale(0.97);
    }

    .menu__button[aria-selected="true"] {
      border-color: var(--active);
      background: var(--active);
      color: var(--active-text);
    }

    .menu__button:focus-visible,
    .product-card:focus-visible,
    .modal__close:focus-visible {
      outline: 3px solid rgba(25, 26, 47, 0.2);
      outline-offset: 3px;
    }

    .content {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 30px 18px calc(40px + env(safe-area-inset-bottom));
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px 14px;
    }

    .product-card {
      display: block;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .product-card__image-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 1px 0 var(--border);
    }

    .product-card__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 260ms ease;
    }

    .product-card:hover .product-card__image {
      transform: scale(1.025);
    }

    .product-card__title {
      display: block;
      margin-top: 11px;
      padding-inline: 2px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .empty-section {
      display: grid;
      min-height: 52vh;
      place-items: center;
      color: var(--muted);
      font-size: 17px;
      text-align: center;
    }

    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
      background: rgba(15, 16, 25, 0.72);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .modal__dialog {
      position: relative;
      overflow: hidden;
      width: min(100%, 520px);
      max-height: calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border-radius: 26px;
      background: var(--background);
      box-shadow: var(--shadow);
    }

    .modal__image {
      display: block;
      width: 100%;
      max-height: calc(100dvh - 122px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      object-fit: contain;
      background: var(--surface);
    }

    .modal__title {
      margin: 0;
      padding: 18px 64px 20px 20px;
      font-size: 19px;
      line-height: 1.3;
    }

    .modal__close {
      position: absolute;
      right: 14px;
      bottom: 13px;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
    }

    body.modal-open {
      overflow: hidden;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 720px) {
      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 34px;
        padding-block: 16px;
      }

      .logo {
        width: 270px;
        margin: 0;
      }

      .menu {
        justify-content: flex-end;
        padding-bottom: 2px;
      }

      .content {
        padding-top: 42px;
      }

      .products {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 24px;
      }

      .product-card__image-wrap {
        border-radius: 24px;
      }

      .product-card__title {
        margin-top: 14px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu__button,
      .product-card__image,
      .modal {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <img class="logo" src="assets/logo.png" alt="Цифровой Рай">

      <nav class="menu" aria-label="Бренды" role="tablist">
        <button class="menu__button" type="button" role="tab" aria-selected="true" data-brand="Gurdini">Gurdini</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="iNeez">iNeez</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="McDodo">McDodo</button>
        <button class="menu__button" type="button" role="tab" aria-selected="false" data-brand="WiWU">WiWU</button>
      </nav>
    </div>
  </header>

  <main class="content">
    <section id="gurdini-products" aria-label="Товары Gurdini">
      <div class="products">
        <button class="product-card" type="button" data-title="Ocean Series" data-image="assets/ocean-series.webp">
          <span class="product-card__image-wrap">
            <img class="product-card__image" src="assets/ocean-series.webp" alt="Чехол Gurdini Ocean Series" loading="eager">
          </span>
          <span class="product-card__title">Ocean Series</span>
        </button>

        <button class="product-card" type="button" data-title="Kevlar Series" data-image="assets/kevlar-series.webp">
          <span class="product-card__image-wrap">
            <img class="product-card__image" src="assets/kevlar-series.webp" alt="Чехол Gurdini Kevlar Series" loading="lazy">
          </span>
          <span class="product-card__title">Kevlar Series</span>
        </button>

        <button class="product-card" type="button" data-title="Clarity Series" data-image="assets/clarity-series.webp">
          <span class="product-card__image-wrap">
            <img class="product-card__image" src="assets/clarity-series.webp" alt="Чехол Gurdini Clarity Series" loading="lazy">
          </span>
          <span class="product-card__title">Clarity Series</span>
        </button>

        <button class="product-card" type="button" data-title="Alba Series" data-image="assets/alba-series.webp">
          <span class="product-card__image-wrap">
            <img class="product-card__image" src="assets/alba-series.webp" alt="Чехол Gurdini Alba Series" loading="lazy">
          </span>
          <span class="product-card__title">Alba Series</span>
        </button>
      </div>
    </section>

    <section class="empty-section" id="empty-section" hidden aria-live="polite">
      <p id="empty-title"></p>
    </section>
  </main>

  <div class="modal" id="product-modal" aria-hidden="true">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <img class="modal__image" id="modal-image" src="" alt="">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="modal__close" id="modal-close" type="button" aria-label="Закрыть">&times;</button>
    </div>
  </div>

  <script>
    const menuButtons = document.querySelectorAll(".menu__button");
    const productCards = document.querySelectorAll(".product-card");
    const productsSection = document.querySelector("#gurdini-products");
    const emptySection = document.querySelector("#empty-section");
    const emptyTitle = document.querySelector("#empty-title");
    const modal = document.querySelector("#product-modal");
    const modalImage = document.querySelector("#modal-image");
    const modalTitle = document.querySelector("#modal-title");
    const modalClose = document.querySelector("#modal-close");
    let lastFocusedCard = null;

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        menuButtons.forEach((item) => item.setAttribute("aria-selected", "false"));
        button.setAttribute("aria-selected", "true");

        const isGurdini = button.dataset.brand === "Gurdini";
        productsSection.hidden = !isGurdini;
        emptySection.hidden = isGurdini;
        emptyTitle.textContent = isGurdini ? "" : `Раздел ${button.dataset.brand} скоро будет заполнен`;
      });
    });

    const closeModal = () => {
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      if (lastFocusedCard) lastFocusedCard.focus();
    };

    productCards.forEach((card) => {
      card.addEventListener("click", () => {
        lastFocusedCard = card;
        modalImage.src = card.dataset.image;
        modalImage.alt = `Gurdini ${card.dataset.title}`;
        modalTitle.textContent = card.dataset.title;
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");
        modalClose.focus();
      });
    });

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.getAttribute("aria-hidden") === "false") closeModal();
    });

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor("#ffffff");
      window.Telegram.WebApp.setBackgroundColor("#ffffff");
    }
  </script>
</body>
</html>
